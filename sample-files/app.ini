; ----------------------------------
;
; Container / 12-factor usage
; ----------------------------------
; Set POWONLINE_CONFIG_FILE to the absolute path of this file instead of
; relying on XDG discovery.  Mount this file as a read-only volume:
;
;   -v /etc/powonline/app.ini:/etc/powonline/app.ini:ro
;   -e POWONLINE_CONFIG_FILE=/etc/powonline/app.ini
;
; The following keys can be supplied as environment variables instead of
; being written into this file.  The env var takes precedence when set:
;
;   [security]  jwt_secret       → POWONLINE_JWT_SECRET
;   [security]  jwt_lifetime     → POWONLINE_JWT_LIFETIME
;   [social:google] client_secret → POWONLINE_GOOGLE_CLIENT_SECRET
;   [social:oidc]   client_secret → POWONLINE_OIDC_CLIENT_SECRET
;   [email]     login            → POWONLINE_EMAIL_LOGIN
;   [email]     password         → POWONLINE_EMAIL_PASSWORD
;   [app]       allowed_origins  → POWONLINE_ALLOWED_ORIGINS
;
; Additional env vars (not in this file):
;   POWONLINE_DSN     — PostgreSQL DSN (always env-var only, no INI equivalent)
;   UVICORN_ARGS      — extra arguments passed verbatim to uvicorn
; ----------------------------------

[meta]
version = 2.7

[app]
upload_folder = /tmp/uploads

; allowed_origins must be set to the hosts which are allowed to call this API.
; Using "*" won't work as API calls need credentials: 'include' on the
; client side.  Override at runtime with POWONLINE_ALLOWED_ORIGINS.
allowed_origins = https://localhost:8080,http://localhost:5173

[email]
host = example.com
; login and password should be supplied via POWONLINE_EMAIL_LOGIN /
; POWONLINE_EMAIL_PASSWORD rather than written here.
login = user@example.com
password = supersecret
port = 993
ssl = true

[db]
; DSN is ignored when POWONLINE_DSN env var is set (preferred for containers).
dsn = postgresql+psycopg://postgres:postgres@db/postgres

[security]
; Supply via POWONLINE_JWT_SECRET in production — do not commit real secrets.
jwt_secret = foobar

; How long a JWT token will be accepted (in seconds).
; Override with POWONLINE_JWT_LIFETIME if needed.
jwt_lifetime = 3600

[social:google]
client_id = <client-id>
; Supply via POWONLINE_GOOGLE_CLIENT_SECRET in production.
client_secret = <client-secret>
redirect_uri = https://localhost:5000/connect/google

; Generic OIDC provider (Keycloak dev container).
; The discovery_url points to the devcontainer Keycloak realm.
; Use the nip.io alias so the same hostname works from the browser and from
; inside the dev container.
; client_secret must match the value configured in the realm export.
; For production, override client_secret with POWONLINE_OIDC_CLIENT_SECRET.
[social:oidc]
client_id = powonline-backend
; Supply via POWONLINE_OIDC_CLIENT_SECRET in production.
client_secret = dev-secret
discovery_url = http://idp.127.0.0.1.nip.io:8080/realms/powonline/.well-known/openid-configuration
