[project]
name = "powonline"
version = "2025.05.13"
authors = [{ name = "Michel Albert", email = "michel@albert.lu" }]
description = "Tracker for PowWow 2017"
readme = "README.rst"
requires-python = ">=3.7"
license = { text = "BSD-3-Clause" }
classifiers = []
dependencies = [
    "bcrypt",
    "config-resolver >= 5.0, <6.0",
    "fastapi",
    "gouge >= 2.0",
    "imapclient",
    "pillow",
    "psycopg[binary]",
    "pusher",
    "pydantic[email]",
    "pyjwt",
    "python-dateutil",
    "python-multipart",
    "pyyaml",
    "requests_oauthlib",
    "sqlalchemy >= 2.0",
    "uvicorn",
]

[dependency-groups]
dev = [
    "alembic",
    "blessings",
    "gouge",
    "httpx>=0.24.1",
    "pytest>=7.4.4",
    "types-Pillow",
    "types-python-dateutil",
    "httpx",
    "pytest",
    "pytest-asyncio",
    "pytest-catchlog",
    "pytest-coverage",
    "pytest-env",
    "mypy>=1.4.1",
]

[project.entry-points."flask.commands"]
grant-admin = "powonline.cli:grant_admin"
revoke-admin = "powonline.cli:revoke_admin"
list-users = "powonline.cli:list_users"
add-local-user = "powonline.cli:add_local_user"
import-csv = "powonline.cli:import_csv"
fetch-mails = "powonline.cli:fetch_mails"

[tool.black]
line_length = 80

[tool.isort]
profile = "black"
force_grid_wrap = 0
include_trailing_comma = true
line_length = 80
multi_line_output = 3
use_parentheses = true
virtual_env = ".venv"

[tool.pylint."messages control"]
disable = ["C0330", "C0326"]

[tool.pylint.format]
max-line-length = "80"

[tool.yamlfix]
line_length = 80
sequence_style = "block_style"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_unimported = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
check_untyped_defs = true
strict_equality = true
exclude = [
    "^database/alembic/versions/.*\\.py$",
    "^tests/.*\\.py$",
]

# Allow some flexibility for complex decorators and third-party libraries
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[[tool.mypy.overrides]]
module = "database.alembic.versions.*"
ignore_errors = true
