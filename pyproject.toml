[project]
name = "powonline"
version = "2026.4.2"
authors = [{ name = "Michel Albert", email = "michel@albert.lu" }]
description = "Tracker for PowWow 2017"
readme = "README.rst"
requires-python = ">=3.9"
license = { text = "BSD-3-Clause" }
classifiers = []
dependencies = [
    "alembic>=1.12.1",
    "authlib>=1.3.0",
    "bcrypt",
    "config-resolver >= 5.0, <6.0",
    "fastapi",
    "gouge >= 2.0",
    "httpx>=0.27.0",
    "imapclient",
    "pillow",
    "psycopg[binary]",
    "pydantic[email]",
    "pyjwt",
    "python-dateutil",
    "python-multipart",
    "pyyaml",
    "sqlalchemy >= 2.0",
    "uvicorn",
]

[dependency-groups]
dev = [
    "alembic",
    "blessings",
    "gouge",
    "httpx>=0.24.1",
    "pytest>=7.4.4",
    "types-Pillow",
    "types-python-dateutil",
    "httpx",
    "pytest",
    "pytest-asyncio",
    "pytest-catchlog",
    "pytest-coverage",
    "pytest-env",
]

[project.entry-points."flask.commands"]
grant-admin = "powonline.cli:grant_admin"
revoke-admin = "powonline.cli:revoke_admin"
list-users = "powonline.cli:list_users"
add-local-user = "powonline.cli:add_local_user"
import-csv = "powonline.cli:import_csv"
fetch-mails = "powonline.cli:fetch_mails"

[tool.black]
line_length = 80

[tool.isort]
profile = "black"
force_grid_wrap = 0
include_trailing_comma = true
line_length = 80
multi_line_output = 3
use_parentheses = true
virtual_env = ".venv"

[tool.pylint."messages control"]
disable = ["C0330", "C0326"]

[tool.pylint.format]
max-line-length = "80"

[tool.yamlfix]
line_length = 80
sequence_style = "block_style"

[build-system]
requires = ["uv_build>=0.11.6,<0.12"]
build-backend = "uv_build"
